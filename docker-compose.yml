services:
  gateway:
    build:
      context: ./Gateway
    ports:
      - "8000:80"
    env_file:
      - ./Gateway/.env
    volumes:
      # original images: ${CHAMELEON_DATA_DIR}/resources/<parent_dataset>/<filename>
      - ${CHAMELEON_DATA_DIR:?set CHAMELEON_DATA_DIR in .env}/resources:/resources
      # generated images, masks, guide images and MUP metadata
      - ${CHAMELEON_DATA_DIR}/results:/results

  image_analyzer:
    build:
      context: ./ImageAnalyzer
    ports:
      - "8001:80"
    env_file:
      - ./ImageAnalyzer/.env
    environment:
      # Must be the HOST path: it is bind-mounted into the sibling MUP container started via docker.sock
      - DATASET_PATH=${CHAMELEON_DATA_DIR}/datasets/
    volumes:
      - ${CHAMELEON_DATA_DIR}/datasets/:/datasets/
      - /var/run/docker.sock:/var/run/docker.sock  # Bind mount the Docker socket

  mask_generator:
    build:
      context: ./MaskGenerator
    ports:
      - "8002:80"
    volumes:
      # cache rembg's u2net weights (~170MB, downloaded on first request)
      - u2net_cache:/root/.u2net

  image_editor:
    build:
      context: ./ImageEditor
    ports:
      - "8003:80"
    env_file:
      - ./ImageEditor/.env

  ucb:
    build:
      context: ./UCB
    ports:
      - "8004:80"
    volumes:
      # bandit state, saved after every update
      - ${CHAMELEON_DATA_DIR}/ucb:/state

  # rejects generated images that fall outside the training distribution (paper §3)
  data_distribution_tester:
    build:
      context: ./DataDistributionTester
    ports:
      - "8005:80"
    volumes:
      - ${CHAMELEON_DATA_DIR}/resources:/resources:ro
      # embeddings of the training images, computed once per dataset
      - ${CHAMELEON_DATA_DIR}/ddt_cache:/cache

  ui:
    build:
      context: ./UI/fairness-lens/
    ports:
      - "3000:80"

volumes:
  u2net_cache:
